name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_IDENTITY_URL: mongodb://127.0.0.1:27017/iamscope_identity_test
      MONGO_DATA_URL: mongodb://127.0.0.1:27017/iamscope_data_test
      SESSION_SECRET: ci-session-secret-ci-session-secret
      CSRF_SECRET: ci-csrf-secret-ci-csrf-secret
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: silent
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (backend + frontend)
        run: npm test

      - name: Build backend + frontend
        run: |
          npm run build:backend
          npm run build:frontend

  a11y:
    name: pa11y
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_API_URL: http://localhost:4000
      - name: Serve + audit
        run: |
          npx --yes serve -s frontend/dist -l 3000 &
          sleep 5
          npx --yes pa11y-ci --config .pa11yci.json
