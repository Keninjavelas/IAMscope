services:
  mongo:
    image: mongo:7
    container_name: iamscope-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate() }"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iamscope-backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_IDENTITY_URL: mongodb://mongo:27017/iamscope_identity?replicaSet=rs0
      MONGO_DATA_URL: mongodb://mongo:27017/iamscope_data?replicaSet=rs0
      CORS_ORIGIN: http://localhost:3000
      SESSION_SECRET: dev-secret
      CSRF_SECRET: dev-secret
      LOG_LEVEL: debug
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: iamscope-frontend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  mongo_data:
