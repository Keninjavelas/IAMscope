services:
  mongo:
    image: mongo:7
    container_name: iamscope-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # A bare rs.initiate() advertises the container's own hostname, which only resolves
      # inside the compose network - so host-side `npm run dev` dies with getaddrinfo
      # ENOTFOUND once the driver enters replica-set discovery. `localhost` is reachable
      # from the host through the published port below, so the documented host-side
      # workflow works; the `backend` service here reaches it with directConnection instead.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iamscope-backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      # The replica set advertises `localhost:27017` (see the `mongo` healthcheck), which
      # inside this container is its own loopback. directConnection keeps the driver on the
      # `mongo` socket it opened instead of re-resolving the advertised member; change
      # streams still work because that socket is a replica set member, not a standalone.
      MONGO_IDENTITY_URL: mongodb://mongo:27017/iamscope_identity?directConnection=true
      MONGO_DATA_URL: mongodb://mongo:27017/iamscope_data?directConnection=true
      CORS_ORIGIN: http://localhost:3000
      # Dev-only placeholders. env.ts enforces the 16-char minimum regardless of NODE_ENV,
      # so these must stay at least 16 chars or this service exits at boot.
      SESSION_SECRET: iamscope-dev-session-secret
      CSRF_SECRET: iamscope-dev-csrf-secret
      LOG_LEVEL: debug
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: iamscope-frontend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  mongo_data:
